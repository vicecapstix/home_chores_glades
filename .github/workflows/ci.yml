name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Drift check: fresh build vs committed root index.html (the deployed file).
      # Non-blocking until the drift epic (#20) is finished; then remove continue-on-error.
      - name: Check root index.html is up to date
        continue-on-error: true
        run: diff -q dist/index.html index.html
